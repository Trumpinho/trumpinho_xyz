<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Football Great Again</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1d3557 0%, #0b1a2e 100%);
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .container {
            border: 4px solid #ffcc00;
            background: rgba(0, 0, 0, 0.5);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-width: 800px;
            width: 90%;
        }

        h1 {
            color: #e63946;
            font-size: 32px;
            text-shadow: 3px 3px 0px #fff;
            line-height: 1.5;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        p {
            font-size: 20px;
            color: #ffcc00;
            line-height: 1.8;
            text-shadow: 2px 2px 0px #000;
        }

        .emoji {
            width: 160px;
            display: block;
            margin: 30px auto 0 auto;
            animation: bounce 2s infinite;
            image-rendering: pixelated;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 20px; }
            p { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Make Football Great Again</h1>
        <p>Something is cooking...</p>
        <img src="trump_shush.png" alt="Trumpinho Shush" class="emoji">
    </div>
</body>
</html>
